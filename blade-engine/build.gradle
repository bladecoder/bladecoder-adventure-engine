plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'com.bladecoder.engine'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

sourceSets {
	main {
		java.srcDirs = ['src']
		resources.srcDirs = ['resources']
	}
}


jar {
	manifest.attributes += [
			'github': 'https://github.com/bladecoder/bladecoder-adventure-engine/',
			'license': 'Apache-2.0',
			'group': project.group,
			'version': project.version,
			'libgdx': libgdxVersion,
			'java': java.targetCompatibility,
			'timestamp': System.currentTimeMillis()
	]
}

dependencies {
  implementation "com.badlogicgames.gdx:gdx:$libgdxVersion"
  implementation "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
  implementation "com.badlogicgames.gdx:gdx-freetype:$libgdxVersion"
  implementation "com.bladecoder.ink:blade-ink:$bladeInkVersion"
  implementation fileTree(dir: 'libs', include: '*.jar')
}


task sourcesJar(type: Jar) {
    from sourceSets.main.allJava
    archiveClassifier = 'sources'
}

task javadocJar(type: Jar) {
    from javadoc
    archiveClassifier = 'javadoc'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'blade-engine'
            from components.java
            artifact sourcesJar
            artifact javadocJar

            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }

            pom {
                name = 'Blade Engine'
                description = 'Classic point and click adventure game engine'
                url = 'https://github.com/bladecoder/bladecoder-adventure-engine'

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'bladecoder'
                        name = 'Rafael Garcia'
                        email = 'bladecoder@gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git@github.com:bladecoder/bladecoder-adventure-engine.git'
                    developerConnection = 'scm:git@github.com:bladecoder/bladecoder-adventure-engine.git'
                    url = 'scm:git@github.com:bladecoder/bladecoder-adventure-engine.git'
                }
            }
        }
    }
    repositories {
        maven {
            def releasesRepoUrl = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
            def snapshotsRepoUrl = "https://central.sonatype.com/repository/maven-snapshots/"
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
            credentials {
                username project.hasProperty('NEXUS_USERNAME') ? NEXUS_USERNAME : "$System.env.NEXUS_USERNAME"
                password project.hasProperty('NEXUS_PASSWORD') ? NEXUS_PASSWORD : "$System.env.NEXUS_PASSWORD"
            }
        }
    }
}

signing {
    if(!version.endsWith('SNAPSHOT')) {
        def signingKey = findProperty('signingInMemoryKey')
        def signingPassword = findProperty('signingInMemoryKeyPassword')

        if (signingKey) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        } else {
            useGpgCmd()
        }

        sign publishing.publications.mavenJava
    }
}


javadoc {
    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

// Embed identity of the actual engine sources, including local snapshot changes.
def automationIdentityDir = layout.buildDirectory.dir('generated/automation-identity')
tasks.register('generateAutomationIdentity') {
    inputs.files(fileTree('src') { include '**/*.java' })
    inputs.property('engineVersion', project.version.toString())
    outputs.dir(automationIdentityDir)
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        fileTree('src').matching { include '**/*.java' }.files.sort { it.path }.each { source ->
            digest.update(project.relativePath(source).getBytes('UTF-8'))
            digest.update(source.bytes)
        }
        def target = automationIdentityDir.get().file('blade-engine-build.properties').asFile
        target.parentFile.mkdirs()
        target.text = "engine_version=${project.version}\nsource_sha256=${digest.digest().encodeHex()}\n"
    }
}
sourceSets.main.resources.srcDir(automationIdentityDir)
processResources.dependsOn tasks.named('generateAutomationIdentity')

sourceSets.test.java.srcDirs = ['test-src']
tasks.register('remoteProtocolTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.bladecoder.engine.remote.RemoteProtocolTest'
}
